<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>URLs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <div class="container mt-5">

      <h1>Lista de URLs</h1>

      <table class="table mt-3" data-test="urls">
        <thead>
          <tr>
            <th>ID</th>
            <th>URL</th>
            <th>Creado</th>
            <th>Última revisión</th>
          </tr>
        </thead>

        <tbody>
          {% for url in urls %}
          <tr data-test="url">
            <td>{{ url[0] }}</td>
            <td>
              <a href="{{ url_for('show_url', id=url[0]) }}">
                {{ url[1] }}
              </a>
            </td>
            <td>{{ url[2] }}</td>
            <td>{{ url[3] if url[3] else '' }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

    </div>
  </body>
</html>
