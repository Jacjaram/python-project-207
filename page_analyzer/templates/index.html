<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Analizador de páginas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <div class="container mt-5">

      <h1 class="text-center">Analizador de páginas</h1>

      {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
          {% for category, message in messages %}
            <div class="alert alert-{{ category }} mt-3">
              {{ message }}
            </div>
          {% endfor %}
        {% endif %}
      {% endwith %}

      <form action="{{ url_for('create_url') }}" method="post" class="mt-4">
        <div class="mb-3">
          <input type="text" name="url" class="form-control" placeholder="Ingresa una URL">
        </div>
        <button class="btn btn-primary">Enviar</button>
      </form>

    </div>
  </body>
</html>
