<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Detalle URL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>

  <body>
    <div class="container mt-5">

      <h1>Detalle de URL</h1>

      <!-- INFO URL -->
      <div class="card mt-3 p-3">
        <p><strong>ID:</strong> {{ url[0] }}</p>
        <p><strong>URL:</strong> {{ url[1] }}</p>
        <p><strong>Fecha:</strong> {{ url[2] }}</p>
      </div>

      <!-- BOTÓN CHECK -->
      <form action="{{ url_for('create_check', id=url[0]) }}" method="post" class="mt-3">
        <button class="btn btn-primary">Revisar</button>
      </form>

      <!-- TABLA CHECKS -->
      <table class="table mt-4" data-test="checks">
        <thead>
          <tr>
            <th>ID</th>
            <th>Status</th>
            <th>H1</th>
            <th>Title</th>
            <th>Description</th>
            <th>Fecha</th>
          </tr>
        </thead>

        <tbody>
          {% for check in checks %}
          <tr>
            <td>{{ check[0] }}</td>
            <td>{{ check[1] }}</td>
            <td>{{ check[2] }}</td>
            <td>{{ check[3] }}</td>
            <td>{{ check[4] }}</td>
            <td>{{ check[5] }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>

      <a href="{{ url_for('list_urls') }}" class="btn btn-secondary mt-3">
        Volver
      </a>

    </div>
  </body>
</html>
